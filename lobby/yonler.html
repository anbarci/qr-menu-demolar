<h1>The Lobby Denizli, dört QR menü</h1><p>Kınıklı'daki kafe ve nargile salonu için dört tasarım. Ürünler ve fiyatlar işletmenin sitesinden; her yön tek başına çalışan bir menü.</p>
<div class="s"><figure><iframe src="index.html" title="A. Lobi gecesi" loading="lazy"></iframe><figcaption><a href="index.html">A. Lobi gecesi, tam sayfa</a><p>Koyu çikolata zemin, logodaki Bodoni harfi, küçük fotoğraflı kategori satırları. Gece ışığında okumak için.</p></figcaption></figure><figure><iframe src="b/index.html" title="B. Salon" loading="lazy"></iframe><figcaption><a href="b/index.html">B. Salon, tam sayfa</a><p>Beyaz duvar ve bordo abajur rengi; kategoriler büyük fotoğraflı, ürün fotoğrafı sağda. Gündüz ve kahvaltı için.</p></figcaption></figure><figure><iframe src="c/index.html" title="C. Gece listesi" loading="lazy"></iframe><figcaption><a href="c/index.html">C. Gece listesi, tam sayfa</a><p>Fotoğrafsız, bütün menü tek sayfada; noktalı satırlarla hızlı okunan fiyat listesi. Siyah zemin, ampul sarısı.</p></figcaption></figure><figure><iframe src="d/index.html" title="D. Vitrin" loading="lazy"></iframe><figcaption><a href="d/index.html">D. Vitrin, tam sayfa</a><p>Şeftali-beyaz amerikan servis rengi; kategoriler yazıyla, ürünler büyük fotoğraflı kartlarda.</p></figcaption></figure>
