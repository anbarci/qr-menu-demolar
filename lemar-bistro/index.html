<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0b">
<meta name="robots" content="noindex">
<title>Lemar Bistro Menü</title>
<meta name="description" content="Lemar Bistro Denizli QR menüsü: Bahçe, Orta Kat ve Teras için kat seçin, canlı müzik ve mutfak menüsünü fiyatlarıyla görün.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Doto:wght@900&display=swap" rel="stylesheet">
<style>/* Hallmark · shape: floor picker + single-column menu sheet · genre: modern-minimal · theme: custom (from the venue's LED marquee sign and tan guitar logo) · job: visit · idea: "the building in cross-section: pick your floor like an elevator, the menu slides up" · vibe: "black stage, yellow bulbs, live music"
 * paper: #0c0c0b · accent: #f7c32e · display: Archivo 62% width · body: Archivo · hero: three stacked floor bands with each floor's own video · nav: sticky floor switcher, search, category chips · footer: location, booking, Instagram · imagery: the venue's own floor videos · signature: the elevator rail 3-2-1 beside the floors
 * axes: dark/condensed-grotesque/marquee · posture: committed band (live music floors) · contrast: pass · fold: pass · v2.0.0 */
:root{
  --ink:#0c0c0b; --panel:#161614; --panel2:#1d1d1a; --line:rgba(255,255,255,.09);
  --led:#f7c32e; --led-ray:rgba(247,195,46,.15); --led-ring:rgba(247,195,46,.45); --led-glow:rgba(247,195,46,.6);
  --tan:#cdb08a; --paper:#f3efe7; --muted:#a29d93; --dim:#8a857c; --rec:#c4161c;
  --shade-strong:rgba(8,8,7,.92); --shade-mid:rgba(8,8,7,.55); --shade-soft:rgba(8,8,7,.15); --shade-top:rgba(12,12,11,.35);
  --font:'Archivo',system-ui,sans-serif; --font-led:'Doto','Archivo',monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:28px; --s8:32px; --s10:40px;
  --r:6px; --tap:44px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);overflow-x:clip}
body{color:var(--paper);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.45}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--led);outline-offset:2px}
button:active,a:active{transform:translateY(1px)}
button:disabled,input:disabled{color:var(--dim);border-color:var(--line);cursor:not-allowed}
h1,h2,h3{text-wrap:balance}
.app{max-width:460px;margin:0 auto;min-height:100dvh;position:relative}

/* giriş */
.giris{display:flex;flex-direction:column;min-height:100dvh;padding:calc(var(--s4) + env(safe-area-inset-top)) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom))}
.ust{display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}
.ust img{width:52px;height:52px;border-radius:50%;display:block}
.ust p{font-size:13px;color:var(--muted);text-align:right;line-height:1.4}
.ust p b{color:var(--paper);font-weight:600}
.giris h1{font-stretch:62%;font-weight:900;text-transform:uppercase;font-size:clamp(44px,13.5vw,60px);line-height:1;margin:var(--s6) 0 var(--s4)}

/* bina: üstte teras, altta bahçe */
.bina{flex:1;display:grid;grid-template-columns:36px minmax(0,1fr);gap:0 var(--s3);min-height:520px}
.ray{position:relative;display:grid;grid-template-rows:repeat(3,minmax(0,1fr))}
.ray::before{content:"";position:absolute;left:50%;top:var(--s5);bottom:var(--s5);width:1px;background:linear-gradient(var(--led),var(--led-ray))}
.ray span{position:relative;align-self:center;justify-self:center;width:36px;height:36px;border-radius:50%;
  background:var(--ink);border:1px solid var(--led-ring);display:grid;place-items:center;
  font-family:var(--font-led);font-weight:900;font-size:20px;color:var(--led);text-shadow:0 0 8px var(--led-glow)}
.katlar{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:var(--s2)}
.kat{position:relative;display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:var(--r);overflow:hidden;
  background:var(--panel);cursor:pointer;isolation:isolate;min-height:164px;transition:border-color .2s}
.kat:hover{border-color:var(--led-ring)}
.kat:active{transform:scale(.99)}
.kat video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.kat::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--shade-strong) 0%,var(--shade-mid) 55%,var(--shade-soft) 100%)}
.kat .ic{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:var(--s4)}
.kat .ad{font-stretch:62%;font-weight:900;text-transform:uppercase;font-size:44px;line-height:1}
.kat .alt{margin-top:var(--s2);font-size:13.5px;color:var(--tan);font-weight:500;padding-right:var(--s10)}
.kat .ok{position:absolute;right:var(--s3);bottom:var(--s3);width:var(--tap);height:var(--tap);border-radius:50%;background:var(--led);color:var(--ink);display:grid;place-items:center;transition:transform .2s}
.kat:hover .ok{transform:translateX(2px)}
.kat .ok svg{width:18px;height:18px}
.canli{position:absolute;top:var(--s3);left:var(--s4);display:inline-flex;align-items:center;gap:var(--s2);
  font-size:12.5px;font-weight:700;color:var(--ink);background:var(--led);padding:var(--s1) var(--s2);border-radius:3px}
.canli i{width:6px;height:6px;border-radius:50%;background:var(--rec);animation:nabiz 1.4s infinite}
@keyframes nabiz{50%{opacity:.25}}

.baglar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);margin-top:var(--s4)}
.baglar a{display:flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);padding:var(--s2) var(--s1);border:1px solid var(--line);border-radius:var(--r);font-size:13px;font-weight:600}
.baglar a:hover{border-color:var(--led-ring)}
.baglar svg{width:16px;height:16px;color:var(--led);flex:none}

/* menü */
.menu{position:fixed;inset:0;z-index:20;background:var(--ink);overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.menu.acik{transform:none;visibility:visible}
.menu-ic{max-width:460px;margin:0 auto;padding-bottom:calc(var(--s10) + env(safe-area-inset-bottom))}
.kapak{position:relative;height:200px;overflow:hidden;isolation:isolate}
.kapak video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.kapak::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,var(--shade-top),var(--ink) 96%)}
.geri{position:absolute;top:calc(var(--s3) + env(safe-area-inset-top));left:var(--s3);width:var(--tap);height:var(--tap);border-radius:50%;border:1px solid var(--line);background:var(--ink);display:grid;place-items:center;cursor:pointer}
.geri svg{width:20px;height:20px}
.kapak .yazi{position:absolute;left:var(--s4);right:var(--s4);bottom:var(--s3)}
.kapak .yazi p{font-family:var(--font-led);font-weight:900;font-size:16px;color:var(--led);text-shadow:0 0 8px var(--led-glow)}
.kapak .yazi h2{font-stretch:62%;font-weight:900;text-transform:uppercase;font-size:52px;line-height:1}

.yapis{position:sticky;top:0;z-index:5;background:var(--ink);border-bottom:1px solid var(--line);padding-top:var(--s3)}
.secici{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0 var(--s4);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.secici button{border:0;background:none;min-height:var(--tap);padding:0 var(--s1);font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.secici button+button{border-left:1px solid var(--line)}
.secici button:hover{color:var(--paper)}
.secici button[aria-pressed=true]{background:var(--led);color:var(--ink)}
.ara{display:flex;align-items:center;gap:var(--s2);margin:var(--s3) var(--s4) 0;padding:0 var(--s3);border-radius:var(--r);background:var(--panel2)}
.ara svg{width:16px;height:16px;color:var(--dim);flex:none}
.ara input{flex:1;min-width:0;border:0;background:none;min-height:var(--tap);font-size:16px;outline:none}
.ara:focus-within{outline:2px solid var(--led);outline-offset:2px}
.ara input::placeholder{color:var(--dim)}
.cipler{display:flex;gap:var(--s2);overflow-x:auto;padding:var(--s3) var(--s4);scrollbar-width:none}
.cipler::-webkit-scrollbar{display:none}
.cipler button{flex:none;min-height:var(--tap);border:1px solid var(--line);background:none;border-radius:99px;padding:0 var(--s4);font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.cipler button:hover{border-color:var(--led-ring)}
.cipler button.aktif{border-color:var(--led);color:var(--led)}

.bolum{padding:var(--s6) var(--s4) var(--s1);scroll-margin-top:184px}
.bolum h3{font-stretch:62%;font-weight:900;text-transform:uppercase;font-size:30px;line-height:1;margin-bottom:var(--s2)}
.urun{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s1) var(--s4);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.urun .n{font-weight:600;font-size:16px}
.urun .f{font-weight:700;font-size:16px;color:var(--led);white-space:nowrap;font-variant-numeric:tabular-nums}
.urun .d{grid-column:1/-1;font-size:13.5px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.urun .m{grid-column:1/-1;font-size:12.5px;color:var(--dim)}
.bos{padding:var(--s10) var(--s4);text-align:center;color:var(--muted)}
.dip{padding:var(--s7) var(--s4) 0;text-align:center;font-size:12.5px;color:var(--dim)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <main class="giris">
    <header class="ust">
      <img src="medya/logo.webp" alt="Lemar Bistro" width="52" height="52">
      <p><b>Denizli</b><br>Canlı müzik, bar ve mutfak</p>
    </header>

    <h1>Hangi<br>kattasınız?</h1>

    <div class="bina">
      <div class="ray" aria-hidden="true"><span>3</span><span>2</span><span>1</span></div>
      <nav class="katlar" aria-label="Kat seçimi">
        <button class="kat" data-kat="teras">
          <video src="medya/kat3.mp4" poster="medya/kat3.jpg" muted autoplay loop playsinline preload="auto" aria-hidden="true"></video>
          <span class="canli"><i></i>Canlı müzik</span>
          <span class="ic"><span class="ad">Teras</span><span class="alt">Sahne, bar ve nargile</span></span>
          <span class="ok"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>
        <button class="kat" data-kat="orta">
          <video src="medya/kat2.mp4" poster="medya/kat2.jpg" muted playsinline preload="none" aria-hidden="true"></video>
          <span class="canli"><i></i>Canlı müzik</span>
          <span class="ic"><span class="ad">Orta Kat</span><span class="alt">Salon, sahne ve bar</span></span>
          <span class="ok"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>
        <button class="kat" data-kat="bahce">
          <video src="medya/kat1.mp4" poster="medya/kat1.jpg" muted playsinline preload="none" aria-hidden="true"></video>
          <span class="ic"><span class="ad">Bahçe</span><span class="alt">Açık hava, kahvaltı ve mutfak</span></span>
          <span class="ok"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>
      </nav>
    </div>

    <div class="baglar">
      <a href="https://maps.app.goo.gl/EnCVthKyuy8dLMnS6" target="_blank" rel="noopener"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>Konum</a>
      <a href="https://shorturl.at/RmmaR" target="_blank" rel="noopener"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Rezervasyon</a>
      <a href="https://www.instagram.com/lemar.bistro/" target="_blank" rel="noopener"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>Instagram</a>
    </div>
  </main>

  <section class="menu" id="menu" aria-hidden="true" aria-labelledby="katAd">
    <div class="menu-ic">
      <div class="kapak" id="kapak">
        <button class="geri" id="geri" aria-label="Kat seçimine dön"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <div class="yazi"><p id="katNo"></p><h2 id="katAd"></h2></div>
      </div>
      <div class="yapis">
        <div class="secici" role="group" aria-label="Kat değiştir">
          <button data-sec="bahce">Bahçe</button><button data-sec="orta">Orta Kat</button><button data-sec="teras">Teras</button>
        </div>
        <label class="ara"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="ara" type="search" placeholder="Menüde ara: burger, mojito, pizza…" aria-label="Menüde ara" autocomplete="off"></label>
        <nav class="cipler" id="cipler" aria-label="Kategoriler"></nav>
      </div>
      <div id="liste"></div>
      <p class="dip">Fiyatlar Türk lirasıdır. Alerjen bilgisi için garsonunuza danışabilirsiniz.</p>
    </div>
  </section>

</div>

<script src="veri.js"></script>
<script>
// orta kat ve teras canlı müzik menüsünü paylaşır; terasta kahvaltı verilmez
var KATLAR = {
  bahce: {no:'Kat 1', ad:'Bahçe', menu:'bahce', video:'kat1'},
  orta:  {no:'Kat 2', ad:'Orta Kat', menu:'teras', video:'kat2'},
  teras: {no:'Kat 3', ad:'Teras', menu:'teras', video:'kat3', haric:['Kahvaltı']}
};
var $ = function(s){return document.querySelector(s)};
var menu = $('#menu'), liste = $('#liste'), cipler = $('#cipler'), ara = $('#ara');
var hareketsiz = matchMedia('(prefers-reduced-motion: reduce)').matches;
var aktif = null;

function kacis(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tr(s){return s.toLocaleLowerCase('tr')}
function baslikHal(s){return s===s.toLocaleUpperCase('tr') ? s.charAt(0)+tr(s.slice(1)) : s}

function ciz(){
  var q = tr(ara.value.trim()), html = '', cip = '';
  var haric = KATLAR[aktif].haric || [];
  VERI[KATLAR[aktif].menu].forEach(function(k){
    if(haric.indexOf(k.ad) > -1) return;
    var us = k.urunler.filter(function(u){return !q || tr(u.ad+' '+u.icerik+' '+k.ad).indexOf(q) > -1});
    if(!us.length) return;
    var ad = baslikHal(k.ad);
    cip += '<button data-git="b'+k.id+'">'+kacis(ad)+'</button>';
    html += '<section class="bolum" id="b'+k.id+'"><h3>'+kacis(ad)+'</h3>';
    us.forEach(function(u){
      var meta = [u.kcal, u.alerjen && 'Alerjen: '+u.alerjen].filter(Boolean).join(', ');
      html += '<div class="urun"><span class="n">'+kacis(u.ad)+'</span><span class="f">'+(u.fiyat ? kacis(u.fiyat)+' ₺' : '')+'</span>'
        + (u.icerik ? '<span class="d">'+kacis(u.icerik.replace(/,(?=\S)/g,', '))+'</span>' : '')
        + (meta ? '<span class="m">'+kacis(meta)+'</span>' : '') + '</div>';
    });
    html += '</section>';
  });
  liste.innerHTML = html || '<p class="bos">“'+kacis(ara.value)+'” için sonuç yok.</p>';
  cipler.innerHTML = cip;
}

function ac(kat){
  if(!KATLAR[kat]) return kapat();
  var k = KATLAR[kat];
  if(aktif !== kat){
    aktif = kat;
    var eski = $('#kapak video'); if(eski) eski.remove();
    $('#kapak').insertAdjacentHTML('afterbegin', '<video src="medya/'+k.video+'.mp4" poster="medya/'+k.video+'.jpg" muted loop playsinline aria-hidden="true"'+(hareketsiz ? '' : ' autoplay')+'></video>');
    $('#katNo').textContent = k.no;
    $('#katAd').textContent = k.ad;
    document.querySelectorAll('[data-sec]').forEach(function(b){b.setAttribute('aria-pressed', b.dataset.sec===kat)});
    ara.value = '';
    ciz();
    menu.scrollTop = 0;
  }
  menu.classList.add('acik');
  menu.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
}
function kapat(){
  menu.classList.remove('acik');
  menu.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}

// her katın masa QR'ı doğrudan #teras, #orta, #bahce adresine bağlanabilir
function yonlen(){ ac(location.hash.slice(1)); }
window.addEventListener('hashchange', yonlen);
document.querySelectorAll('[data-kat]').forEach(function(b){ b.onclick = function(){ location.hash = b.dataset.kat; }; });
document.querySelectorAll('[data-sec]').forEach(function(b){ b.onclick = function(){ location.replace('#'+b.dataset.sec); }; });
$('#geri').onclick = function(){ history.replaceState(null, '', location.pathname + location.search); kapat(); };
ara.addEventListener('input', ciz);
cipler.addEventListener('click', function(e){
  var b = e.target.closest('[data-git]'); if(!b) return;
  cipler.querySelectorAll('.aktif').forEach(function(x){x.classList.remove('aktif')});
  b.classList.add('aktif');
  document.getElementById(b.dataset.git).scrollIntoView({behavior: hareketsiz ? 'auto' : 'smooth'});
});
if(hareketsiz) document.querySelectorAll('video').forEach(function(v){v.removeAttribute('autoplay');v.pause()});
yonlen();
</script>
</body>
</html>
